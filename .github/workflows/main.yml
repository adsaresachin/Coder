name: AWS OIDC S3 Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  s3-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::597106152171:role/tt
          aws-region: ap-south-1

      - name: Test S3 access
        run: aws s3 ls
